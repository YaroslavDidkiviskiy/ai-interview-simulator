services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ai_interview_simulator
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 3s
      timeout: 3s
      retries: 5

  app:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@db:5432/ai_interview_simulator
      REDIS_URL: redis://redis_container:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis_container:
        condition: service_healthy

  celery_worker:
    build: .
    command: celery -A app.celery_app worker --loglevel=info --concurrency=2
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@db:5432/ai_interview_simulator
      REDIS_URL: redis://redis_container:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis_container:
        condition: service_healthy

  celery_beat:
    build: .
    command: celery -A app.celery_app beat --loglevel=info
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@db:5432/ai_interview_simulator
      REDIS_URL: redis://redis_container:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis_container:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: "http://localhost:8000"
    ports:
      - "80:80"
    depends_on:
      - app

  redis_gui:
    image: redis/redisinsight:latest
    ports:
      - "5540:5540"
    depends_on:
      - redis_container

  redis_container:
    image: redis:latest
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 5

volumes:
  pgdata: {}
  ollama_data: {}
  redis_data: {}